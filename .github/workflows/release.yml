name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "847291038472",
                "project_id": "mosque-seba",
                "storage_bucket": "mosque-seba.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:847291038472:android:6b5a3e218c9f0d4a7b2e1c",
                    "android_client_info": {
                      "package_name": "com.mosqueseba.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB3-dummyKeyMosqueSebaAppBuild01234"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Official Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.0.39}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`  
            > **অফিসিয়াল সাইনিং কি:** স্থায়ী অফিসিয়াল রিলিজ কি-স্টোর দ্বারা স্বাক্ষরিত (পরবর্তী আপডেটে আনইনস্টল করার প্রয়োজন হবে না)

            ## 📲 সরাসরি ডাউনলোড লিংক:
            - 📦 **অ্যান্ড্রয়েড APK (সরাসরি মোবাইলে ইনস্টলের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **অফিসিয়াল AAB (Android App Bundle - গুগল প্লে স্টোর / অফিসিয়াল স্টোরের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 অফিসিয়াল রিলিজ v1.1.2-এর নতুন ফিচার ও আধুনিক আপডেট:
            - 🛡️ **এন্টারপ্রাইজ হাই সিকিউরিটি হার্ডেনিং (Enterprise Security Hardening):** Strict HTTPS-only Network Security Config (অনিরাপদ cleartext HTTP ট্র্যাফিক সম্পূর্ণ নিষিদ্ধ); Anti-Backup ও Anti-Extraction Rules (`android:allowBackup="false"` এবং `data_extraction_rules.xml` যার মাধ্যমে adb বা থার্ড-পার্টি টুল দিয়ে ডাটাবেজ চুরি বন্ধ); সংবেদনশীল ফিন্যান্সিয়াল পেজে স্ক্রিন রেকর্ড ও স্ক্রিনশট প্রটেকশন (`FLAG_SECURE`); রুট ও টেম্পার ডিটেকশন গার্ড (`MosqueSecurityManager.kt`) এবং সুরক্ষিত FileProvider (`com.mosqueseba.app.fileprovider`)।
            - 🔄 **ইন-অ্যাপ অটো আপডেট ও সরাসরি এপিকে ডাউনলোডার (In-App Direct APK Updater):** নতুন ভার্সন রিলিজ হলে অ্যাপের ভেতরে স্বয়ংক্রিয় ডায়ালগে নতুন ফিচারের বিবরণ ও রিলিজ নোটস প্রদর্শন; ব্রাউজারে রিডাইরেক্ট না হয়ে অ্যাপের ভেতর থেকেই অ্যান্ড্রয়েড `DownloadManager`-এর মাধ্যমে নোটিফিকেশন প্রগ্রেসহ সরাসরি এপিকে ডাউনলোড ও ইনস্টলেশন।
            - 🔤 **ইনস্টল-পরবর্তী অ্যাপের নাম ইংরেজি "Mosque Seba" (English Launcher Label):** মোবাইলের হোম স্ক্রিন এবং অ্যাপ ড্রয়ারে অ্যাপটি পরিষ্কার ও প্রফেশনাল ইংরেজি `"Mosque Seba"` নামে প্রদর্শিত হবে।
            - ☁️ **ডায়নামিক লোগো ও গঠনতন্ত্র/আইন ক্লাউড অটো-সিঙ্ক (Dynamic Supabase Cloud Sync):** সুপাবেইজ ক্লাউড ডেটাবেজে নতুন লোগো (`logo_url`) অথবা নতুন আইন ও নোটিশ যুক্ত করলেই দ্বিমুখী সিঙ্কের মাধ্যমে তাৎক্ষণিকভাবে কোনো কোড পরিবর্তন বা অ্যাপ রি-ইনস্টল ছাড়াই সম্পূর্ণ অ্যাপে পরিবর্তিত হয়ে যাবে।
            - ✍️ **ডিজিটাল সিল ও স্বাক্ষর সমন্বিত রসিদ ও ভাউচার:** খতিয়ান, ক্যাশবক্স ও রসিদে সভাপতি, সাধারণ সম্পাদক ও ক্যাশিয়ারের অফিসিয়াল সিল-স্বাক্ষর সম্বলিত প্রফেশনাল ভাউচার ও ১-ক্লিক প্রিন্ট/পিডিএফ।

            ---
            *নির্মাণে ও সৌজন্যে: [Emran Mahmud (@emranmofficials)](https://github.com/${{ github.repository_owner }})*
