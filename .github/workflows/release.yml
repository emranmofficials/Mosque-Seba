name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify required files
        run: |
          test -f app/google-services.json && echo "google-services.json OK" || { echo "MISSING google-services.json"; exit 1; }
          test -f keystore/mosque-seba.jks && echo "Release keystore OK" || echo "WARN: release keystore missing, will use debug signing"

      - name: Build Official Release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.1.7}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          else
            echo "ERROR: release APK not found"; exit 1
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -lh release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*
            > **Application Package:** `com.mosqueseba.app`

            ## 📲 সরাসরি ডাউনলোড:
            - 📦 **APK (মোবাইলে ইনস্টলের জন্য):** 👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **AAB (Play Store-এর জন্য):** 👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 v1.1.7 — নতুন ফিচার ও গুরুত্বপূর্ণ ফিক্স:
            - 🔐 **পুরো আসল Supabase Auth:** GoTrue সাইনআপ/লগইন/JWT রিফ্রেশ/পাসওয়ার্ড পরিবর্তন; মোবাইল-নম্বার-only সদস্যদের জন্য deterministic synthetic email; real Auth UID-লিংক করা প্রোফাইল।
            - 🛡️ **কঠোর RLS ও মাল্টি-টেন্যান্ট আইসোলেশন:** ৪৮টি policy, text tenant helper, anon lookup RPC; এক মসজিদের তথ্য অন্য মসজিদ দেখতে পারবে না।
            - ☁️ **সব ২৫টি টেবিলের ক্লাউড সিঙ্ক + লাইভ Realtime:** OkHttp Phoenix WebSocket, JWT-জয়েন, `postgres_changes` ইভেন্টে তাৎক্ষণিক সিঙ্ক।
            - 🐛 **গুরুত্বপূর্ণ বাগ ফিক্স:** মসজিদ বদলালে পুরনো ডেটা নতুন টেন্যান্টে ঢুকে যাওয়া; ভুল কমিটি আইডিতে লোকাল ডেটা নষ্ট হওয়া; পাসওয়ার্ড পরিবর্তনে ভুল ইমেইল/session; logout-এর পর Realtime stale JWT; **অ্যাপ ওপেনে ক্রাশ করা cold-start NPE** (init-block-এর আগে fields সরিয়ে ফিক্স)।
            - 🚑 **CrashLogger:** MIUI-সহ সব ডিভাইসে ক্রাশ হলে stack trace `Downloads/mosque_seba_crash.txt`-এ সংরক্ষিত হয়।

            ---
            *নির্মাণে ও সৌজন্যে: [Emran Mahmud (@emranmofficials)](https://github.com/${{ github.repository_owner }})*
