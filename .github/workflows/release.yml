name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "847291038472",
                "project_id": "mosque-seba",
                "storage_bucket": "mosque-seba.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:847291038472:android:6b5a3e218c9f0d4a7b2e1c",
                    "android_client_info": {
                      "package_name": "com.mosqueseba.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB3-dummyKeyMosqueSebaAppBuild01234"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Official Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.0.36}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`  
            > **অফিসিয়াল সাইনিং কি:** স্থায়ী অফিসিয়াল রিলিজ কি-স্টোর দ্বারা স্বাক্ষরিত (পরবর্তী আপডেটে আনইনস্টল করার প্রয়োজন হবে না)

            ## 📲 সরাসরি ডাউনলোড লিংক:
            - 📦 **অ্যান্ড্রয়েড APK (সরাসরি মোবাইলে ইনস্টলের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **অফিসিয়াল AAB (Android App Bundle - গুগল প্লে স্টোর / অফিসিয়াল স্টোরের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 এই সংস্করণের (v1.0.36) নতুন ফিচার ও আধুনিক রিডিজাইন:
            - 🔍 **স্ট্যান্ডার্ড ও অভিন্ন সার্চ বক্স ও ইনপুট ফিল্ড:** অ্যাপের সকল পেজ, স্ক্রিন ও ডায়ালগের (সদস্য, আয়-ব্যয়, নোটিশ, আরও মডিউল, নির্বাচন, মাদরাসা ও অফিস ডকুমেন্ট) সার্চ বক্সগুলোকে একটি স্ট্যান্ডার্ড সাইজ (min 50.dp), প্রিমিয়াম কর্নার রেডিয়াস (14.dp) ও থিম-অ্যাওয়ার কনটেইনারে রূপান্তর করা হয়েছে।
            - ✨ **মসৃণ এলিমেন্ট ও ট্রানজিশন অ্যানিমেশন:** প্রতিটি স্ক্রিন, ট্যাব, মডিউল এবং কার্ডে (মেম্বার কার্ড, লেজার ট্রানজ্যাকশন, নোটিশ, মিটিং, মডিউল গ্রিড) বাউন্সি ও স্মুথ পর্যায়ক্রমিক (staggered) এন্ট্রান্স অ্যানিমেশন যুক্ত করা হয়েছে।
            - 🚀 **তাত্ক্ষণিক ও সরাসরি স্প্ল্যাশ স্ক্রিন প্রদর্শন:** অ্যাপের উইন্ডো থিম সরাসরি স্প্ল্যাশ ডার্ক এমারেল্ড ব্যাকগ্রাউন্ডে কনফিগার করা হয়েছে, যাতে অ্যাপ চালুর সময় কোনো সাদা বা ব্ল্যাঙ্ক ফ্লিকার না এসে সরাসরি দৃষ্টিনন্দন স্প্ল্যাশ স্ক্রিন আসে।
            - 📱 **সম্পূর্ণ রিডিজাইন স্প্ল্যাশ স্ক্রিন ও নতুন অনবোর্ডিং (Onboarding) স্ক্রিন:**
              - স্প্ল্যাশ স্ক্রিন রিডিজাইন: ডুয়েল অ্যাম্বিয়েন্ট পালস রিং, থ্রিডি গোল্ডেন এমব্লেম, ক্যালিগ্রাফিক পিল ব্যাজ ও স্মুথ টাইপোগ্রাফি।
              - ৪টি আকর্ষণীয় স্লাইড সম্বলিত অনবোর্ডিং ওয়াকথ্রু: ডিজিটাল আয়-ব্যয়, ওয়াক্ত ও স্মার্ট নোটিশ বোর্ড, মাদরাসা ও হিফজ ট্র্যাকার, এবং কমিটি নির্বাচন ও বহুমুখী সেবা।
              - অ্যাকাউন্ট সেটিংস থেকে যে কোনো সময় অনবোর্ডিং গাইড পুনরায় দেখার সুবিধা।
            - 🛠️ **ইউআই ডিজাইন চেক ও কোড অপ্টিমাইজেশন:** সমস্ত স্ক্রিন ও ডায়ালগে প্রোপার প্যাডিং, এলাইন্টমেন্ট এবং ব্যালেন্সড ব্র্যাকেট শতভাগ নিশ্চিত করা হয়েছে।

            ---
            *নির্মাণে ও সৌজন্যে: [Emran Mahmud (@emranmofficials)](https://github.com/emranmofficials)*
