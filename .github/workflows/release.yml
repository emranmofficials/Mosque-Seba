name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-apk
          TAG="${GITHUB_REF_NAME:-v1.0.1}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-apk/Mosque-Seba-${TAG}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-apk/Mosque-Seba-${TAG}.apk"
          fi
          ls -la release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-APK
          path: release-apk/*.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-apk/*.apk
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`

            ## 📲 সরাসরি APK ডাউনলোড করুন:
            নিচের লিঙ্ক অথবা রিলিজ অ্যাসেট থেকে সরাসরি আপনার অ্যান্ড্রয়েড মোবাইলে ডাউনলোড ও ইন্সটল করুন:
            👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**

            ---

            ### 🚀 এই রিলিজের ফিক্স ও পরিবর্তনসমূহ:
            - **কোটলিন কম্পাইলার ফিক্স:** `kotlin.android` প্লাগইন সক্রিয় করে সম্পূর্ণ কোটলিন কোডবেজ এবং রুম ডেটাবেজের সঠিক বাইটকোড কম্পাইলেশন নিশ্চিত করা হয়েছে।
            - **ক্র্যাশ সমাধান (`ClassNotFoundException`):** অ্যান্ড্রয়েড ১৪ এবং অন্যান্য ডিভাইসে লঞ্চ ক্র্যাশ স্থায়ীভাবে দূরীভূত করা হয়েছে।
            - **জাভা ১৭ স্ট্যান্ডার্ড:** অ্যান্ড্রয়েড রানটাইম আর্কিটেকচারের সাথে সম্পূর্ণ সামঞ্জস্যপূর্ণ `Java 17` বাইটকোড টার্গেট করা হয়েছে।

            - 🕌 **স্মার্ট ড্যাশবোর্ড ও ওয়াক্ত ট্র্যাকার:** ৫ ওয়াক্তের নামাজের বিস্তারিত সময়সূচি, পরবর্তী ওয়াক্তের কাউন্টডাউন ও কুইক অ্যাকশন।
            - 👥 **সদস্য ব্যবস্থাপনা:** সাধারণ ও আজীবন সদস্যদের প্রোফাইল ও মাসিক চাঁদার রেকর্ড।
            - 💰 **স্বচ্ছ ফিন্যান্স ও অডিট:** আয় ও ব্যয়ের লেজার, নগদ/ব্যাংক ব্যালেন্স এবং মাসিক আর্থিক বিবরণী।
            - 🧾 **ডিজিটাল চাঁদা রসিদ:** তাৎক্ষণিক কিউআর কোড ভেরিফিকেশন সহ ডিজিটাল রসিদ শেয়ারিং।
            - 📚 **মাদরাসা ও মক্তব:** ছাত্র ভর্তি, পারাভিত্তিক হিফজ ট্র্যাকার (স্টার রেটিং সহ), ফি কালেকশন ও অভিভাবক পোর্টাল।
            - 👔 **ইমাম ও কর্মচারী পে-রোল:** মাসিক বেতন বণ্টন এবং ফিন্যান্সে স্বয়ংক্রিয় ব্যয় ভাউচার এন্ট্রি।
            - 🕌 **ডিউটি রোস্টার ও খাবার শিডিউল:** ইমামতি ও আজানের দায়িত্ব বণ্টন এবং খাবার বণ্টন ট্র্যাকার।
            - 🤝 **সমাজকল্যাণ ও যাকাত তহবিল:** চিকিৎসা, শিক্ষা, বিধবা-এতিম ও খাদ্য সহায়তার আবেদন এবং অনুদান অনুমোদন।
            - 📅 **মাহফিল ও বিশেষ অনুষ্ঠান:** বাৎসরিক ওয়াজ, শবে কদর, রমজান ইফতার মাহফিলের পূর্ণাঙ্গ শিডিউল।
            - 📝 **কমিটি সভা ও রেজুলেশন:** সভার শিডিউল, এজেন্ডা এবং গৃহীত সিদ্ধান্তের স্থায়ী রেজুলেশন রেকর্ড।
            - ✨ **জেমিনি এআই নোটিশ ড্রাফটার:** নোটিশের টাইটেল থেকে তাৎক্ষণিক প্রফেশনাল নোটিশ ড্রাফট।
            - 🗄️ **রুম ডাটাবেজ (v3):** সম্পূর্ণ অফলাইন-ফার্স্ট ১৭টি এন্টিটি ও প্রি-লোডেড ডাটা।

            ---
