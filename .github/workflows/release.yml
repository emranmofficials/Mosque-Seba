name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "847291038472",
                "project_id": "mosque-seba",
                "storage_bucket": "mosque-seba.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:847291038472:android:6b5a3e218c9f0d4a7b2e1c",
                    "android_client_info": {
                      "package_name": "com.mosqueseba.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB3-dummyKeyMosqueSebaAppBuild01234"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Official Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.0.39}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`  
            > **অফিসিয়াল সাইনিং কি:** স্থায়ী অফিসিয়াল রিলিজ কি-স্টোর দ্বারা স্বাক্ষরিত (পরবর্তী আপডেটে আনইনস্টল করার প্রয়োজন হবে না)

            ## 📲 সরাসরি ডাউনলোড লিংক:
            - 📦 **অ্যান্ড্রয়েড APK (সরাসরি মোবাইলে ইনস্টলের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **অফিসিয়াল AAB (Android App Bundle - গুগল প্লে স্টোর / অফিসিয়াল স্টোরের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 এই সংস্করণের (v1.0.39) নতুন ফিচার ও আধুনিক আপডেট:
            - 🌙 **স্মার্ট ইসলামিক ক্যালেন্ডার ও হিজরি ইভেন্ট হাব (AI-Powered Islamic Hub):** আশুরা, সীরাতুন্নবী (সা:), শবে মেরাজ, শবে বরাত, পবিত্র রমজান, লাইলাতুল কদর, ঈদুল ফিতর, শাওয়ালের ৬ রোজা, জিলহজের প্রথম দশক, আরাফাহ দিবস, ঈদুল আজহা, তাশরিকের দিনসমূহ ও আইয়ামে বিজ সহ বাৎসরিক ১৩টি গুরুত্বপূর্ণ ইসলামিক দিবসের নির্ভুল হিসাব।
            - ⏳ **রিয়েল-টাইম কাউন্টডাউন ও স্ট্যাটাস ট্র্যাকার:** ড্যাশবোর্ডে "আর মাত্র X দিন বাকি", "বর্তমানে চলমান", "আজকে অনুষ্ঠিত হচ্ছে", "আগামীকাল" ইত্যাদি লাইভ ব্যাজ ও কাউন্টডাউন।
            - 🌖 **চাঁদ দেখার তারতম্য সমন্বয় (Moon Sighting Offset):** স্থানীয় চাঁদ দেখার ওপর ভিত্তি করে ১ ক্লিকেই -১ দিন, স্বাভাবিক বা +১ দিন অ্যাডজাস্ট করার স্থায়ী মেমোরি ফিচার।
            - 🤖 **জেমিনি এআই ইসলামিক বয়ান ও খুতবা সহায়িকা:** প্রতিটি দিবসের জন্য কুরআন ও সহিহ হাদিসের আলোকে খতিব ও ইমামদের জন্য জুমার বয়ানের পয়েন্ট এবং সাধারণ মুসল্লিদের জন্য নফল আমলের পূর্ণাঙ্গ গাইডলাইন স্বয়ংক্রিয় তৈরির এআই ক্ষমতা।
            - 📢 **১-ক্লিকে নোটিশ খসড়া তৈরি:** যেকোনো ইসলামিক দিবসের পূর্বপ্রস্তুতি বা কর্মসূচি সরাসরি মসজিদের ডিজিটাল নোটিশ বোর্ডে খসড়া আকারে প্রেরণ করার সুবিধা।
            - 📴 **শতভাগ অফলাইন ব্যাকআপ:** ইন্টারনেট বা এআই সার্ভিস সাময়িক অফলাইনে থাকলেও প্রতিটি দিবসের প্রামাণ্য ইসলামিক তথ্য ও নফল আমলের তালিকা তাৎক্ষণিক দৃশ্যমান।

            ---
