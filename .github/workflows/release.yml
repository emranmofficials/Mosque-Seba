name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "847291038472",
                "project_id": "mosque-seba",
                "storage_bucket": "mosque-seba.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:847291038472:android:6b5a3e218c9f0d4a7b2e1c",
                    "android_client_info": {
                      "package_name": "com.mosqueseba.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB3-dummyKeyMosqueSebaAppBuild01234"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Official Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.0.39}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`  
            > **অফিসিয়াল সাইনিং কি:** স্থায়ী অফিসিয়াল রিলিজ কি-স্টোর দ্বারা স্বাক্ষরিত (পরবর্তী আপডেটে আনইনস্টল করার প্রয়োজন হবে না)

            ## 📲 সরাসরি ডাউনলোড লিংক:
            - 📦 **অ্যান্ড্রয়েড APK (সরাসরি মোবাইলে ইনস্টলের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **অফিসিয়াল AAB (Android App Bundle - গুগল প্লে স্টোর / অফিসিয়াল স্টোরের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 অফিসিয়াল রিলিজ v1.1.1-এর নতুন ফিচার ও আধুনিক আপডেট:
            - ✍️ **ডিজিটাল স্বাক্ষর ও সিল প্যাড (Official Seal & Signature Pad):** পদধারী সদস্যদের জন্য টাচ-স্ক্রিন ক্যানভাসে সরাসরি আঙুল বা স্টাইলাস দিয়ে ডিজিটাল স্বাক্ষর ড্রয়িং, অফিসিয়াল সিল স্ট্যাম্প আপলোড এবং সকল রসিদ ও ভাউচারে ডিজিটাল পদবিসহ সিল-স্বাক্ষর সংযোজন (Room DB v10)।
            - 📦 **জুমার ক্যাশবক্স ৩-সাক্ষী কাউন্টার (Jummah Cashbox 3-Witness Counter):** জুমার নামাজ শেষে দানবাক্স খোলার পর ১০০০ থেকে ৫ টাকার ব্যাংক নোটের লাইভ ক্যাশ কাউন্টিং, ৩ জন স্বতন্ত্র দায়িত্বশীল সাক্ষীর সিল-স্বাক্ষর ভেরিফিকেশন ও স্বয়ংক্রিয়ভাবে অডিট লগসহ ফিন্যান্স ভাউচার পোস্টিং।
            - 🖨️ **১-ক্লিক নেটিভ প্রিন্ট ও পিডিএফ (Native 1-Click Print & PDF):** চাঁদার রসিদ, ব্যয় ভাউচার, বেতন স্লিপ এবং নোটিশ তাৎক্ষণিকভাবে সরাসরি যেকোনো প্রিন্টারে প্রিন্ট বা মোবাইল-ফ্রেন্ডলি সুরক্ষিত পিডিএফ তৈরি (`MosquePrintHelper.kt`)।
            - 🎨 **দাওয়াতনামা মাহফিল পোস্টার এআই (Gemini 3.8 Flash Poster Maker):** গুগল জেমিনি এআই দিয়ে ইসলামী ওয়াজ মাহফিল, দোয়া ও আলোচনা সভার দৃষ্টিনন্দন পোস্টার প্রম্পট ও প্রফেশনাল ইভেন্ট দাওয়াতনামা স্বয়ংক্রিয়ভাবে প্রস্তুত ও নোটিশে ছবি সংযুক্তি।
            - 🚨 **জরুরি জানাজা অ্যালার্ট ব্রডকাস্টার (Emergency Janaza Alert):** মহল্লার কোনো মুসল্লির ইন্তেকালে তাৎক্ষণিক জানাজার সময়, নামাজের স্থান ও কবরস্থান উল্লেখ করে সরাসরি এসএমএস ও হোয়াটসঅ্যাপ ব্রডকাস্ট ও অ্যাপ নোটিফিকেশন।
            - 🌙 **পবিত্র রমজান স্পেশাল হাব (Ramadan Special Hub):** সেহরি ও ইফতারের লাইভ কাউন্টডাউন টাইমার, তারাবিহর নামাজ ও ইতিকাফ ট্র্যাকিং এবং পূর্ণাঙ্গ খতমে কুরআন অগ্রগতি ট্র্যাকার।
            - 🗳️ **কমিটি নির্বাচন ও গেজেট নোটিফিকেশন (Election & Gazette):** স্বচ্ছ গণতান্ত্রিক প্রক্রিয়ায় তফসিল ঘোষণা, মনোনয়নপত্র যাচাই-বাছাই, প্রতীক বরাদ্দ এবং চূড়ান্ত গেজেট নোটিফিকেশন প্রকাশনা।
            - ☁️ **সুপাবেইজ ক্লাউড ব্যাকএন্ড (Supabase PostgreSQL 17 Live Sync):** সম্পূর্ণ ডেডিকেটেড ক্লাউড প্রজেক্ট (`donglyxtrfyzwgtrskhz`), ২৮টি ডেটাবেজ টেবিল, ৪টি RLS সিকিউরিটি পলিসি, ১০টি সার্ভার-সাইড RPCs এবং স্বয়ংক্রিয় দ্বিমুখী সিঙ্ক।
            - 🏛️ **প্রফেশনাল ম্যানেজমেন্ট হার্ডেনিং ও হেডার ক্লিনআপ:** হেডারে ইউজারের নামের উপরে প্রতিষ্ঠানের নাম বন্ধ করে অফিশিয়াল ব্র্যান্ড লোগো, ইউজারের নাম ও পদবি প্রদর্শন; প্রাতিষ্ঠানিক নাম শুধু ড্যাশবোর্ড হিরো কার্ডে সুসজ্জিত; জিরো-ইমোজি পলিসি নিশ্চিতকরণ।

            ---
            *নির্মাণে ও সৌজন্যে: [Emran Mahmud (@emranmofficials)](https://github.com/${{ github.repository_owner }})*
