name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Mosque Seba Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback google-services.json"
            cat << 'EOF' > app/google-services.json
            {
              "project_info": {
                "project_number": "847291038472",
                "project_id": "mosque-seba",
                "storage_bucket": "mosque-seba.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:847291038472:android:6b5a3e218c9f0d4a7b2e1c",
                    "android_client_info": {
                      "package_name": "com.mosqueseba.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyB3-dummyKeyMosqueSebaAppBuild01234"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Official Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${GITHUB_REF_NAME:-v1.0.37}"
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Mosque-Seba-${TAG}.apk"
          fi
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/Mosque-Seba-${TAG}.aab"
          fi
          ls -la release-artifacts/

      - name: Upload Artifacts as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Mosque-Seba-Release-Packages
          path: release-artifacts/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }} Official Release"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
          body: |
            # 🕌 মসজিদ সেবা (Mosque Seba) — ${{ github.ref_name }}

            > **অফিসিয়াল স্লোগান:** *মসজিদের খেদমতে আধুনিক প্রযুক্তি, পরিচালনায় স্বচ্ছ আস্থা*  
            > **Application Package:** `com.mosqueseba.app`  
            > **অফিসিয়াল সাইনিং কি:** স্থায়ী অফিসিয়াল রিলিজ কি-স্টোর দ্বারা স্বাক্ষরিত (পরবর্তী আপডেটে আনইনস্টল করার প্রয়োজন হবে না)

            ## 📲 সরাসরি ডাউনলোড লিংক:
            - 📦 **অ্যান্ড্রয়েড APK (সরাসরি মোবাইলে ইনস্টলের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.apk)**
            - 📱 **অফিসিয়াল AAB (Android App Bundle - গুগল প্লে স্টোর / অফিসিয়াল স্টোরের জন্য):**  
              👉 **[Mosque-Seba-${{ github.ref_name }}.aab](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Mosque-Seba-${{ github.ref_name }}.aab)**

            ---

            ### 🚀 এই সংস্করণের (v1.0.37) নতুন ফিচার ও আধুনিক আপডেট:
            - 🏢 **মসজিদের স্থাবর ও অস্থাবর সম্পত্তি ব্যবস্থাপনা ও দলিল আপলোড:** মসজিদের প্রোফাইলে জমি, মার্কেট/দোকান, মাদরাসা ভবন, পুকুর, যন্ত্রপাতি ও সরঞ্জামাদির রেকর্ড রাখার পূর্ণাঙ্গ ব্যবস্থা। গ্যালারি থেকে দলিলের ছবি আপলোড, ফুল-রেজোলিউশন ফটো প্রিভিউ, ক্যাটাগরি ও স্ট্যাটাস ভিত্তিক ফিল্টারিং এবং এডিট ও ডিলিট সুবিধা।
            - 💎 **রেজিস্ট্রেশন পেজের ইনপুট ফিল্ড স্ট্যান্ডার্ডাইজেশন:** রেজিস্ট্রেশন পেজের সকল ইনপুট ফিল্ডকে অ্যাপের স্ট্যান্ডার্ড ফিল্ড ফরম্যাটে (১৪.dp প্রিমিয়াম কর্নার, থিম-অ্যাওয়ার কনটেইনার ও স্ট্যান্ডার্ড কালার) রূপান্তর করা হয়েছে।
            - ☀️ **টপ বার ও সিস্টেম স্ট্যাটাস বার স্পষ্টীকরণ:** অ্যান্ড্রয়েড সিস্টেম স্ট্যাটাস বার (ঘড়ি, ব্যাটারি, ওয়াইফাই আইকন) এবং অ্যাপ টপ বারের টেক্সট কালার অপ্টিমাইজ করা হয়েছে যাতে ডার্ক এমারেল্ড ব্যাকগ্রাউন্ডেও সবকিছু সম্পূর্ণ স্পষ্ট ও পরিষ্কারভাবে ফুটে ওঠে।
            - 🕌 **হেডারে স্থায়ী অ্যাপ লোগো:** হেডারের বাম পাশে অ্যাপের অফিসিয়াল লোগো স্থায়ীভাবে প্রদর্শন নিশ্চিত করা হয়েছে, ফলে মসজিদের নিজস্ব লোগো আপলোড করলেও হেডারের অ্যাপ লোগো পরিবর্তন হবে না।
            - 🗄️ **রুম ডাটাবেজ ভার্সন ৮ ও স্বয়ংক্রিয় মাইগ্রেশন:** নতুন `mosque_properties` টেবিল যোগ করে ডাটাবেজ ভার্সন ৮-এ উন্নীত করা হয়েছে। পূর্বে থাকা কোনো ডাটা না হারিয়ে স্বয়ংক্রিয়ভাবে মাইগ্রেশন নিশ্চিত করা হয়েছে।

            ---
