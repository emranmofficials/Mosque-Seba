name: Generate Official Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    name: Generate Official Keystore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate and Commit Keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/mosque-seba.jks \
            -alias mosqueseba \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mosquesebakeystore2026 \
            -keypass mosquesebakeystore2026 \
            -dname "CN=Mosque Seba Official, OU=Development, O=Mosque Seba, L=Dhaka, ST=Dhaka, C=BD"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f keystore/mosque-seba.jks
          git commit -m "chore(keystore): add permanent official release keystore [skip ci]"
          git push origin main
