name: Build Mosque Seba Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift & Riverpod Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos || true

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosqueSeba-v1.3.1-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.1
          name: Mosque Seba v1.3.1 Official Release
          body: |
            ## 🕌 Mosque Seba (মসজিদ সেবা) v1.3.1 Official Release
            - 🎨 **সেরা রেসপনসিভ ও অ্যাডাপ্টিভ ইউআই:** ট্যাবলেট ও লার্জ স্ক্রিনে ডুয়াল-কলাম ড্যাশবোর্ড ও আধুনিক কার্ড রিপল এফেক্ট
            - 🕌 **ডিজিটাল মসজিদ ডিসপ্লে গ্রিড:** ডিজিটাল ঘড়ি/টিভি মনিটরে ৫ ওয়াক্ত নামাজের সময়সূচি ও বর্তমান/পরবর্তী ওয়াক্তের গোল্ডেন আভা
            - 📊 **আর্থিক অ্যানালিটিক্স চার্ট ও অনুপাত:** আয় বনাম ব্যয় তুলনামূলক বার এবং শীর্ষ খাতওয়ারি ভিজ্যুয়াল প্রগ্রেস
            - 🌙 **১-ট্যাপ ইসলামিক নাইট মোড:** ফজর ও এশার ওয়াক্তের জন্য আই-কমফোর্ট ডার্ক থিম সুইচার
            - 📋 **ক্যাশ রশিদ ও ভাউচার ইনস্ট্যান্ট শেয়ার:** হোয়াটসঅ্যাপ ও মেসেজিংয়ে সরাসরি ডিজিটাল রশিদ শেয়ার ও PDF প্রিন্ট
            - 🆔 **র‍্যান্ডম কোড জেনারেশন:** ৮ সংখ্যার মেম্বার আইডি ও ১০ সংখ্যার মসজিদ কমিটি আইডি
            - 📷 **প্রোফাইল ও লোগো আপলোড:** ক্যামেরা/গ্যালারি থেকে সরাসরি ক্লাউড ও অফলাইন স্টোরেজ ব্যাকআপ
            
            **Download the APK file below directly to your phone:**
          files: build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true
