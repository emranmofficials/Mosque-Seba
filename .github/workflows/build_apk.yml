name: Build Mosque Seba Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift & Riverpod Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosqueSeba-v1.3.0-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: Mosque Seba v1.3.0 Official Release
          body: |
            ## 🕌 Mosque Seba (মসজিদ সেবা) v1.3.0 Official Release
            - 🔔 রিয়েল-টাইম পুশ নোটিফিকেশন ও ইনস্ট্যান্ট অ্যালার্ট সাপোর্ট
            - 🍞 প্রিমিয়াম ফ্লোটিং টোস্ট নোটিফিকেশন (সফল, ত্রুটি, তথ্য ও সতর্কতা)
            - ⚠️ কনফার্মেশন ও ডিলিট ওয়ার্নিং ডায়ালগ (AppDialogs)
            - 🆔 সদস্যদের জন্য ৮ সংখ্যার ইউনিকোড রেন্ডম আইডি (Member Code)
            - 🕌 মসজিদের জন্য ১০ সংখ্যার ইউনিক আইডি / কমিটি কোড (Mosque ID)
            - 📷 প্রোফাইল ছবি ও মসজিদের লোগো ক্যামেরা/গ্যালারি থেকে ক্লাউড ও অফলাইন আপলোড
            - ⚡ সম্পূর্ণ অফলাইন Drift SQLite ডাটাবেজ এবং Supabase ক্লাউড অটো-সিঙ্ক
            
            **Download the APK file below directly to your phone:**
          files: build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true
