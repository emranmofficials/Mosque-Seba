name: Build Mosque Seba Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Drift & Riverpod Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MosqueSeba-v1.2.5-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.5
          name: Mosque Seba v1.2.5 (Release APK)
          body: |
            ## 🕌 Mosque Seba (মসজিদ সেবা) v1.2.5
            - Complete 1:1 Flutter rebuild with 37 modules
            - Offline-first SQLite database
            - Full multi-role authorization and real-time prayer schedule
            
            **Download the APK file below directly to your phone:**
          files: build/app/outputs/flutter-apk/app-release.apk
        continue-on-error: true
